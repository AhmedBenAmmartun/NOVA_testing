[package]
name = "nova-vision-client"
version = "0.1.0"
description = "NOVA trusted live vision control surface"
authors = ["NOVA"]
edition = "2021"

[lib]
name = "nova_vision_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
